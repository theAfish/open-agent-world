[project]
name = "open-agent-world-backend"
version = "0.1.0"
description = "Authoritative world and capability backend for Open Agent World"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    # cryptography 49+ no longer publishes Intel macOS wheels.
    "cryptography>=45,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=45,<51; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "packaging>=24,<27",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
adk = ["google-adk>=2.8,<3"]
litellm = ["litellm>=1.74,<2"]
# The knowledge base plugin's engines. Declared here so `uv sync` keeps them: a
# sync prunes anything outside the lock, which silently breaks the card.
knowledge = [
    "mat-know-base",
    "pymupdf4llm>=0.0.17",
]

[tool.uv.sources]
# Interim: the plugin needs mat_know_base changes that are not yet pushed (the
# knowledge repository and the file object store). Switch to the published repo
# once they land: { git = "https://github.com/theAfish/mat_know_base.git" }
mat-know-base = { path = "/home/ruoyu/projects/mat_know_base", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".."]

[tool.uv]
package = false
