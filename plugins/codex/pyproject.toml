[project]
name = "open-agent-world-plugin-codex"
version = "0.3.0"
description = "Codex App Server runtime for Open Agent World Agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.entry-points."open_agent_world.plugins"]
openai-codex = "oaw_codex:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_codex"]
