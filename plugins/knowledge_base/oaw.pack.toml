# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.40"
oaw = ">=0.1.0,<1"

[distribution]
id = "knowledge.base"
name = "Knowledge Base"

[plugin]
owner = "knowledge.base"
packs = ["knowledge.base.default"]
node_types = ["knowledge.base"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[components.frontend]
entry = "frontend/index.tsx"
project = "frontend/package.json"
mode = "pack-build"

