# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.41"
oaw = ">=0.1.0"

[distribution]
id = "atomsculptor.default"
name = "AtomSculptor"

[plugin]
owner = "atomsculptor"
packs = ["atomsculptor.default"]
node_types = ["atomsculptor.agent","atomsculptor.skills","atomsculptor.skills.skill","atomsculptor.structure","atomsculptor.log-review-agent","atomsculptor.review-skills","atomsculptor.review-skills.skill"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[components.frontend]
entry = "frontend/index.tsx"
mode = "pack-build"
project = "frontend/package.json"

# Modelling and bundled Skills use OAW's host-prepared shared Sandbox Python.
[environments.modelling]
target = "sandbox"
provider = "python"
management = "legacy-shared"
prepare = "on-use"
# Keep ordinary command admission to the modelling core. All packages below
# remain prepared; bundled Skills verify their additional imports on use.
verify_imports = ["ase", "numpy"]
python = ["ase>=3.22", "matplotlib>=3.7", "mp-api", "numpy>=1.23", "pandas", "pymatgen>=2024.0", "rdkit"]

[prerequisites.model-connection]
kind = "model-connection"
description = "A configured model connection selected for the modelling Agent."

[prerequisites.materials-project]
kind = "credential"
description = "A Materials Project API key configured for the skill."

[features.agent]
environments = ["modelling"]
prerequisites = ["model-connection"]

[environments.log-review]
target = "sandbox"
provider = "python"
management = "legacy-shared"
prepare = "on-use"
python = ["ase>=3.22", "matplotlib>=3.7", "numpy>=1.23"]
verify_imports = ["ase", "matplotlib", "numpy"]

[features.log-review]
environments = ["log-review"]
prerequisites = ["model-connection"]

[environments.crystal-builder]
target = "sandbox"
provider = "python"
management = "legacy-shared"
verify_imports = ["ase", "numpy"]
sources = [{ path = "src/oaw_atomsculptor/skills/crystal-builder/requirements.txt", kind = "requirements" }]

[features.crystal-builder]
environments = ["crystal-builder"]

[environments.interface-builder]
target = "sandbox"
provider = "python"
management = "legacy-shared"
verify_imports = ["ase", "numpy", "pymatgen.core"]
sources = [{ path = "src/oaw_atomsculptor/skills/interface-builder/requirements.txt", kind = "requirements" }]

[features.interface-builder]
environments = ["interface-builder"]

[environments.materials-project-search]
target = "sandbox"
provider = "python"
management = "legacy-shared"
verify_imports = ["mp_api.client"]
sources = [{ path = "src/oaw_atomsculptor/skills/materials-project-search/requirements.txt", kind = "requirements" }]

[features.materials-project-search]
environments = ["materials-project-search"]
prerequisites = ["materials-project"]

[environments.molecular-structure-creation]
