[project]
name = "oaw-visualization"
version = "0.1.0"
description = "Connected, read-only visualization cards for Open Agent World"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.entry-points."open_agent_world.plugins"]
oaw-visualization = "oaw_visualization:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_visualization"]
