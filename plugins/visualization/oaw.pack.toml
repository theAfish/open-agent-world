# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.28"
oaw = ">=0.1.0,<1"

[distribution]
id = "data.visualization"
name = "Data Visualization"

[plugin]
owner = "data.visualization"
packs = ["data.visualization.default"]
node_types = ["data.visualization.bar","data.visualization.graph","data.visualization.histogram","data.visualization.line","data.visualization.scatter"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[components.frontend]
entry = "frontend/index.tsx"
project = "frontend/package.json"
mode = "pack-build"

