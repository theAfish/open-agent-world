schema_version = 3

[distribution]
id = "theafish.office"
name = "Office Skills"
presentation = "src/oaw_office/pack.json"

[compatibility]
plugin_api = "1.35"
oaw = ">=0.6.0,<1"

[plugin]
owner = "oaw.office"
packs = ["oaw.office.default"]
node_types = ["oaw.office.toolbox", "oaw.office.toolbox.skill"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[environments.word]
target = "sandbox"
provider = "python"
prepare = "on-use"
python = ["python-docx>=1.2,<2"]
verify_imports = ["docx"]

[environments.excel]
target = "sandbox"
provider = "python"
prepare = "on-use"
python = ["openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]
verify_imports = ["openpyxl", "defusedxml"]

[environments.powerpoint]
target = "sandbox"
provider = "python"
prepare = "on-use"
python = ["python-pptx>=1.0.2,<2"]
verify_imports = ["pptx"]

[features.word]
environments = ["word"]

[features.excel]
environments = ["excel"]

[features.powerpoint]
environments = ["powerpoint"]
