[project]
name = "oaw-office"
version = "0.1.0"
description = "Word, Excel and PowerPoint skills for Open Agent World"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."open_agent_world.plugins"]
"oaw.office" = "oaw_office:create_plugin"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
