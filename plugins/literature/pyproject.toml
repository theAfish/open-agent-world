[project]
name = "oaw-literature"
version = "0.1.0"
description = "Source-traceable literature resources and portable research Skills for OAW"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "oaw-library>=0.2.0"]

[project.entry-points."open_agent_world.plugins"]
literature = "oaw_literature:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_literature"]
