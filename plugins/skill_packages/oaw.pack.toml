# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.14"
oaw = ">=0.1.0,<1"

[distribution]
id = "oaw.skills"
name = "Skill Toolboxes"

[plugin]
owner = "oaw.skills"
packs = ["oaw.skills.default"]
node_types = ["oaw.skills","oaw.skills.skill"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

