# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.30"
oaw = ">=0.1.0,<1"

[distribution]
id = "oaw.barracks"
name = "Agent Barracks"

[plugin]
owner = "oaw.barracks"
packs = ["oaw.barracks.default"]
node_types = ["oaw.barracks","oaw.barracks.summoner"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

