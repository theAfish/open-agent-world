[project]
name = "oaw-sqlite"
version = "0.1.0"
description = "Persistent, scoped SQLite databases for Open Agent World"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.entry-points."open_agent_world.plugins"]
oaw-sqlite = "oaw_sqlite:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_sqlite"]
