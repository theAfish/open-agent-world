# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.23"
oaw = ">=0.1.0,<1"

[distribution]
id = "oaw.tasks"
name = "Task Board"

[plugin]
owner = "oaw.tasks"
packs = ["oaw.tasks.default"]
node_types = ["oaw.tasks"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

