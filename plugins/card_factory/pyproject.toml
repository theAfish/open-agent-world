[project]
name = "oaw-card-factory"
version = "0.1.0"
description = "Visual card and Pack authoring for Open Agent World"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.entry-points."open_agent_world.plugins"]
oaw-card-factory = "oaw_card_factory:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_card_factory"]
