[compatibility]
plugin_api = "1.41"
oaw = ">=0.1.0,<1"

[distribution]
id = "research.xrd"
name = "XRD Analysis"

[plugin]
owner = "research.xrd"
packs = ["research.xrd.default"]
node_types = ["xrd.analysis","xrd.cif","xrd.library","xrd.match","xrd.multiphase-harness","xrd.pattern","xrd.reference","xrd.spectrum-canvas","xrd.structure-canvas"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[components.frontend]
entry = "frontend/index.tsx"
project = "frontend/package.json"
mode = "pack-build"

[environments.scientific]
target = "host-worker"
provider = "python"
requires_python = ">=3.10"
prepare = "on-use"
management = "managed"
sources = [{ path = "src/oaw_xrd/OAW_XRDfit/requirements.txt", kind = "requirements" }]
verify_imports = ["numpy", "scipy", "pandas", "pymatgen", "tensorflow"]
verify_script = "src/oaw_xrd/verify_environment.py"

[environments.qualx]
target = "host-worker"
provider = "executable"
prepare = "manual"
accept_external = true
executable_names = ["qualx"]
verify_argv = ["--help"]
verify_pattern = '(?s)(?=.*--settings-dir)(?=.*--database)(?=.*--wavelength)'

[prerequisites.qualx]
kind = "executable"
description = "Optional patched QualX executable discovered on PATH or explicitly configured with OAW_XRD_QUALX_EXECUTABLE."
optional = true

[prerequisites.pow-cod]
kind = "resource"
description = "Optional local POW_COD database configured through the XRD card."
optional = true

[features.fitting]
environments = ["scientific"]

[[dependencies]]
kind = "owner"
id = "science.structure-viewer"

[features.full-library-search]
environments = ["qualx", "scientific"]
prerequisites = ["qualx", "pow-cod"]
optional = true

