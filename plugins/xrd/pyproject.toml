[project]
name = "oaw-xrd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]
[project.entry-points."open_agent_world.plugins"]
xrd = "oaw_xrd:create_plugin"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/oaw_xrd"]
