[project]
name = "oaw-xrd"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1"]
[project.entry-points."open_agent_world.plugins"]
xrd = "oaw_xrd:create_plugin"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/oaw_xrd"]

[tool.hatch.build]
artifacts = ["src/oaw_xrd/OAW_XRDfit/**/*.json"]
