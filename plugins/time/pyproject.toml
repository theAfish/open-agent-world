[project]
name = "oaw-time"
version = "0.1.0"
description = "Minimal timepieces, timers, calendars and counters for Open Agent World"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "tzdata>=2024.1"]

[project.entry-points."open_agent_world.plugins"]
oaw-time = "oaw_time:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_time"]
