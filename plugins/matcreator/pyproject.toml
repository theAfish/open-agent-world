[project]
name = "oaw-matcreator"
version = "0.10.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.entry-points."open_agent_world.plugins"]
matcreator = "oaw_matcreator:create_plugin"

[project.entry-points."open_agent_world.setup"]
native = "oaw_matcreator.native_environment:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oaw_matcreator", "oaw_matcreator_engine"]
