# Dependency intent only; installation and readiness are tracked separately.
schema_version = 3

[compatibility]
plugin_api = "1.35"
oaw = ">=0.1.0,<1"

[distribution]
id = "theafish.codex"
name = "Codex Agent"
presentation = "src/oaw_codex/pack.json"

[plugin]
owner = "openai.codex"
packs = ["openai.codex.default"]
node_types = ["openai.codex.agent"]

[components.backend]
project = "pyproject.toml"
mode = "host-adapter"

[components.frontend]
entry = "frontend/index.tsx"
project = "frontend/package.json"
mode = "pack-build"

[prerequisites.codex-cli]
kind = "executable"
executable = "codex"
description = "A configured Codex CLI; detected by the existing Pack discovery service."

[environments.client]
target = "host-worker"
provider = "executable"
prepare = "manual"
accept_external = true
executable_names = ["codex"]
verify_argv = ["--version"]
verify_pattern = '^codex-cli '

[features.agent]
environments = ["client"]
prerequisites = ["codex-cli"]

