[project]
name = "open-agent-world-plugin-greeter"
version = "0.1.0"
description = "A minimal end-to-end Open Agent World plugin example"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.entry-points."open_agent_world.plugins"]
greeter = "oaw_greeter_plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaw_greeter_plugin"]
