name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            extension: exe
          - runner: macos-14
            platform: macos-arm64
            extension: dmg
          - runner: macos-15-intel
            platform: macos-x86_64
            extension: dmg
            tauri_bundles: app
            manual_dmg: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      OAW_SIGNED_RELEASE: ${{ vars.OAW_SIGNED_RELEASE }}
      OAW_UPDATER_PUBLIC_KEY: ${{ vars.OAW_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Require official Marketplace binding for tagged releases
        if: github.ref_type == 'tag'
        run: python scripts/check-marketplace-release.py
      - name: Sync desktop version from tag
        if: github.ref_type == 'tag'
        shell: python
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, re

          tag = os.environ['REF_NAME']
          if not tag.startswith('v'):
              raise SystemExit(f'Expected release tag to start with v, got {tag!r}')
          version = tag[1:]
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', version):
              raise SystemExit(f'Expected semantic version tag like v1.2.3, got {tag!r}')

          package_path = pathlib.Path('desktop/package.json')
          package_data = json.loads(package_path.read_text())
          package_data['version'] = version
          package_path.write_text(json.dumps(package_data, indent=2) + '\n')

          lock_path = pathlib.Path('desktop/package-lock.json')
          lock_data = json.loads(lock_path.read_text())
          lock_data['version'] = version
          lock_data['packages']['']['version'] = version
          lock_path.write_text(json.dumps(lock_data, indent=2) + '\n')

          tauri_config_path = pathlib.Path('desktop/src-tauri/tauri.conf.json')
          tauri_config = json.loads(tauri_config_path.read_text())
          tauri_config['version'] = version
          tauri_config_path.write_text(json.dumps(tauri_config, indent=2) + '\n')

          cargo_path = pathlib.Path('desktop/src-tauri/Cargo.toml')
          cargo_text = cargo_path.read_text()
          cargo_text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', cargo_text, count=1)
          cargo_path.write_text(cargo_text)
      - name: Check release version
        shell: python
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, tomllib
          version = json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']
          assert json.loads(pathlib.Path('desktop/package.json').read_text())['version'] == version
          lock = json.loads(pathlib.Path('desktop/package-lock.json').read_text())
          assert lock['version'] == version
          assert lock['packages']['']['version'] == version
          assert tomllib.loads(pathlib.Path('desktop/src-tauri/Cargo.toml').read_text())['package']['version'] == version
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == 'v' + version, 'Tag must match desktop version'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select Rust
        run: rustup default stable
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'oaw-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              "OAW_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }
          }
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/oaw-build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          export OAW_CERTIFICATE_PATH="$RUNNER_TEMP/oaw-signing.p12"
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["OAW_CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$OAW_CERTIFICATE_PATH" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$OAW_CERTIFICATE_PATH"
      - name: Configure signing and updater
        run: python scripts/configure-desktop-release.py
      - name: Build Windows installer and verify payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          uv venv backend/.venv --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
          ./scripts/build-desktop.ps1
      - name: Build macOS installer and verify app
        if: runner.os == 'macOS'
        env:
          OPEN_AGENT_WORLD_TAURI_BUNDLES: ${{ matrix.tauri_bundles }}
          OPEN_AGENT_WORLD_MANUAL_DMG: ${{ matrix.manual_dmg }}
        run: bash scripts/build-desktop.sh
      - name: Collect installer and checksum
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          import hashlib, json, os, pathlib, shutil
          version = json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']
          files = list(pathlib.Path('desktop/src-tauri/target/release/bundle').rglob('*.' + os.environ['EXTENSION']))
          assert len(files) == 1, f'Expected one installer, found {files}'
          output = pathlib.Path('release-assets')
          output.mkdir()
          name = f"Open-Agent-World-{version}-{os.environ['PLATFORM']}.{os.environ['EXTENSION']}"
          target = output / name
          shutil.copy2(files[0], target)
          digest = hashlib.file_digest(target.open('rb'), 'sha256').hexdigest()
          (output / (name + '.sha256')).write_text(f'{digest}  {name}\n')
      - name: Collect signed updater payload
        if: env.OAW_UPDATER_ENABLED == '1'
        run: python scripts/collect-desktop-update.py --platform ${{ matrix.platform }}
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && env.OAW_SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          Get-ChildItem release-assets/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Installer signature is not valid' }
          }
      - name: Verify macOS notarization
        if: runner.os == 'macOS' && env.OAW_SIGNED_RELEASE == 'true'
        run: |
          xcrun stapler validate 'desktop/src-tauri/target/release/bundle/macos/Open Agent World.app'
          spctl --assess --type execute --verbose=2 'desktop/src-tauri/target/release/bundle/macos/Open Agent World.app'
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/oaw-build.keychain-db"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Assemble complete updater manifest
        if: vars.OAW_UPDATER_PUBLIC_KEY != ''
        run: python3 scripts/collect-desktop-update.py --manifest
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Open Agent World $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
