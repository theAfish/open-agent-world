name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release source and CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify committed versions, tag ancestry and latest exact-commit checks
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-release.py --verify-ci
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: release-validation.json
          if-no-files-found: error

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            extension: exe
          - runner: macos-14
            platform: macos-arm64
            extension: dmg
          - runner: macos-15-intel
            platform: macos-x86_64
            extension: dmg
            tauri_bundles: app
            manual_dmg: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      OAW_SIGNED_RELEASE: ${{ vars.OAW_SIGNED_RELEASE }}
      OAW_UPDATER_PUBLIC_KEY: ${{ vars.OAW_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight signing and updater configuration
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: python scripts/configure-desktop-release.py --preflight
      - name: Require official Marketplace binding when opted in
        if: github.event_name == 'push' && github.ref_type == 'tag' && vars.OAW_REQUIRE_MARKETPLACE == 'true'
        run: python scripts/check-marketplace-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Check committed release version
        run: python scripts/check-release.py
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select Rust
        run: rustup default stable
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'oaw-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              "OAW_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }
          }
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/oaw-build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          export OAW_CERTIFICATE_PATH="$RUNNER_TEMP/oaw-signing.p12"
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["OAW_CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$OAW_CERTIFICATE_PATH" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$OAW_CERTIFICATE_PATH"
      - name: Configure signing and updater
        run: python scripts/configure-desktop-release.py
      - name: Build Windows installer and verify payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          uv venv backend/.venv --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
          ./scripts/build-desktop.ps1
      - name: Install Windows package and verify every payload file
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'OAW installer acceptance with spaces'
          if (Test-Path -LiteralPath $installRoot) { throw 'Installer acceptance requires a fresh directory' }
          $policy = Get-ItemPropertyValue 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' LongPathsEnabled
          if ($policy -ne 1) { throw 'Windows installer acceptance requires Win32 long paths enabled' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installRoot" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:OAW_INSTALLED_PAYLOAD = Join-Path $installRoot 'payload'
          @'
          import hashlib, os
          from pathlib import Path
          source = Path(".open-agent-world/desktop-payload")
          installed = Path(os.environ["OAW_INSTALLED_PAYLOAD"])
          files = [p.relative_to(source) for p in source.rglob("*") if p.is_file()]
          assert files and any(len(str(installed / p)) > 260 for p in files)
          for relative in files:
              with (source / relative).open("rb") as expected, (installed / relative).open("rb") as actual:
                  assert hashlib.file_digest(expected, "sha256").digest() == hashlib.file_digest(actual, "sha256").digest(), relative
          print(f"PASS: all {len(files)} installed payload files match, including long paths")
          '@ | backend/.venv/Scripts/python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload differs from verified build payload' }
          $env:PATH = (Join-Path $env:OAW_INSTALLED_PAYLOAD 'tools') + ';' + $env:PATH
          & (Join-Path $env:OAW_INSTALLED_PAYLOAD 'python/python.exe') -I -B (Join-Path $env:OAW_INSTALLED_PAYLOAD 'launch.py') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload self-test failed' }
      - name: Build macOS installer and verify app
        if: runner.os == 'macOS'
        env:
          OPEN_AGENT_WORLD_TAURI_BUNDLES: ${{ matrix.tauri_bundles }}
          OPEN_AGENT_WORLD_MANUAL_DMG: ${{ matrix.manual_dmg }}
        run: bash scripts/build-desktop.sh
      - name: Collect installer and checksum
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          import hashlib, json, os, pathlib, shutil
          version = json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']
          files = list(pathlib.Path('desktop/src-tauri/target/release/bundle').rglob('*.' + os.environ['EXTENSION']))
          assert len(files) == 1, f'Expected one installer, found {files}'
          output = pathlib.Path('release-assets')
          output.mkdir()
          name = f"Open-Agent-World-{version}-{os.environ['PLATFORM']}.{os.environ['EXTENSION']}"
          target = output / name
          shutil.copy2(files[0], target)
          digest = hashlib.file_digest(target.open('rb'), 'sha256').hexdigest()
          (output / (name + '.sha256')).write_text(f'{digest}  {name}\n')
      - name: Collect signed updater payload
        if: env.OAW_UPDATER_ENABLED == '1'
        run: python scripts/collect-desktop-update.py --platform ${{ matrix.platform }}
      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && env.OAW_SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          Get-ChildItem release-assets/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Installer signature is not valid' }
          }
      - name: Verify macOS notarization
        if: runner.os == 'macOS' && env.OAW_SIGNED_RELEASE == 'true'
        run: |
          xcrun stapler validate 'desktop/src-tauri/target/release/bundle/macos/Open Agent World.app'
          spctl --assess --type execute --verbose=2 'desktop/src-tauri/target/release/bundle/macos/Open Agent World.app'
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/oaw-build.keychain-db"
      - name: Record source and artifact checksums
        run: python scripts/release-assets.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Verify artifacts and prepare release
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-validation
          path: release-assets
      - name: Assemble complete updater manifest
        if: vars.OAW_UPDATER_PUBLIC_KEY != ''
        run: python3 scripts/collect-desktop-update.py --manifest
      - name: Verify complete artifacts and generate traceable release notes
        run: python3 scripts/release-assets.py --assemble
      - name: Retain verified release evidence for manual previews and tags
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release-assets/release-manifest.json
            release-assets/release-validation.json
            release-notes.generated.md
          if-no-files-found: error
      - name: Create draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
            gh release edit "$RELEASE_TAG" --prerelease="$PRERELEASE" --notes-file release-notes.generated.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$PRERELEASE" --title "Open Agent World $RELEASE_TAG" --notes-file release-notes.generated.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
