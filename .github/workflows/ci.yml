name: Pull request checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            plugins/*/pyproject.toml
      - name: Sync locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-extras --group dev
      - name: Install repository plugins
        working-directory: backend
        shell: bash
        run: |
          mapfile -t plugin_roots < <(
            find ../plugins -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | sort
          )
          if ((${#plugin_roots[@]} == 0)); then
            echo "No repository plugin packages found" >&2
            exit 1
          fi
          install_args=()
          for plugin_root in "${plugin_roots[@]}"; do
            install_args+=(--editable "$plugin_root")
          done
          uv pip install --python .venv/bin/python "${install_args[@]}"
      - name: Run backend and plugin test suite
        working-directory: backend
        run: .venv/bin/python -m pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
